name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: Existing version tag to publish (for example, v0.1.0)
        required: true
        type: string

env:
  RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_VERSION }}
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Run tests
        run: go test ./...

  build-portable:
    name: Build ${{ matrix.goos }} ${{ matrix.goarch }}
    needs: test
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_VERSION }}
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          suffix=""
          if [[ "$GOOS" == "windows" ]]; then suffix=".exe"; fi
          mkdir -p package
          commit="$(git rev-parse --short=12 HEAD)"
          built="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          go build -trimpath \
            -ldflags "-X dgs-toolbox/internal/buildinfo.Version=${RELEASE_VERSION} -X dgs-toolbox/internal/buildinfo.Commit=${commit} -X dgs-toolbox/internal/buildinfo.Date=${built}" \
            -o "package/dgs${suffix}" ./cmd/dgs
      - name: Package
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          archive="dgs_${RELEASE_VERSION}_${GOOS}_${GOARCH}"
          if [[ "$GOOS" == "windows" ]]; then
            (cd package && zip -9 "../${archive}.zip" dgs.exe)
          else
            tar -C package -czf "${archive}.tar.gz" dgs
          fi
      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: dgs-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dgs_*
          if-no-files-found: error

  build-macos:
    name: Build darwin ${{ matrix.goarch }}
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: arm64
            runner: macos-15
          - goarch: amd64
            runner: macos-15-intel
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_VERSION }}
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build and sign
        shell: bash
        env:
          EXPECTED_GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          test "$(go env GOARCH)" = "$EXPECTED_GOARCH"
          mkdir -p package
          commit="$(git rev-parse --short=12 HEAD)"
          built="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          go build -trimpath \
            -ldflags "-X dgs-toolbox/internal/buildinfo.Version=${RELEASE_VERSION} -X dgs-toolbox/internal/buildinfo.Commit=${commit} -X dgs-toolbox/internal/buildinfo.Date=${built} -linkmode=external -extldflags '-sectcreate __TEXT __info_plist ./internal/desktop/reminders/Info.plist'" \
            -o package/dgs ./cmd/dgs
          codesign --force --sign - --identifier dev.dgs-toolbox.dgs package/dgs
      - name: Package
        shell: bash
        env:
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          tar -C package -czf "dgs_${RELEASE_VERSION}_darwin_${GOARCH}.tar.gz" dgs
      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: dgs-darwin-${{ matrix.goarch }}
          path: dgs_*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs:
      - build-portable
      - build-macos
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download archives
        uses: actions/download-artifact@v4
        with:
          pattern: dgs-*
          path: dist
          merge-multiple: true
      - name: Generate checksums
        working-directory: dist
        run: sha256sum dgs_* > checksums.txt
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_VERSION" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$RELEASE_VERSION" \
            --generate-notes
