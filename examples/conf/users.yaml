# People. Not Linux accounts, and not passwords.
#
#   access        the routes this person may use, by name
#   credentials   their credentials, each against a note saying where it is
#                 used — free text dgs never reads. Omitted, they have one
#                 called `default`. A device names which one it uses, and two
#                 devices naming the same one share a password.
#   username      the account name services see. Defaults to the key here.
#   devices       `none` when this inventory deliberately holds no node file
#                 for them, which tells that apart from device files put in
#                 the wrong place.
#   export        which form their files render as, for the credentials no
#                 device of theirs carries.
#
# A change here is the audit: one diff says who gained or lost access.

users:
  alice:
    access: [sfo-01-ss, sfo-01-hy2]
    credentials:
      default:
        note: The phone, and anything else without a credential of its own.
      # The laptop leaves the house, so it keeps a credential of its own and
      # only the Shadowsocks line: losing it revokes this one value, and
      # neither the phone nor the Hysteria2 line is touched.
      laptop:
        note: alice's laptop, so it can be cut off on its own
        access: [sfo-01-ss]

  # A relay in front of the same server: one route, one credential, no device
  # file — the machine running it is not in this inventory.
  repeater:
    devices: none
    access: [sfo-01-ssrelay]

  # Two people this inventory deliberately holds no node file for. The
  # credential belongs to the person; what is handed over is a share URI,
  # because which client they run is not knowable here.
  bob:
    devices: none
    export: link
    access: [sfo-01-ss, sfo-01-hy2, hkg-sfo-01-ss]

  guest:
    devices: none
    export: link
    access: [sfo-01-ss]
