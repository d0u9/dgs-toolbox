# Routes: one chain each, from where traffic enters to where it leaves,
# written as an ordered list of hops. A hop is `<instance>:<port>`, and each
# adjacent pair is one edge whose address dgs works out from the two nodes.
#
# A route's name is what a person sees when they pick a line in their client,
# so keep the machine out of it — a route may enter one server today and its
# replacement tomorrow.
#
# A one-hop route is an ordinary route. Reaching a service directly is not a
# special form.

routes:
  # The protocol is in the name because this server offers both, so picking
  # one is the choice being offered: a network that blocks Shadowsocks still
  # leaves Hysteria2. A server offering one protocol would not write it.
  sfo-01-ss:
    hops: [ss-sfo01:users]

  # A program on the relay machine dials the separate `relays` account table.
  # Its principal in that node file says whose authorised credential it uses.
  hkg-local-sfo-01-ss:
    hops: [sslocal-hkg01:socks, ss-sfo01:relays]

  sfo-01-hy2:
    hops: [hy2-sfo01:users]

  # The same exit, reached through a relay that terminates nothing. Two hops,
  # and the account is the one at the end: a person holding this line and the
  # line above uses one password and dials two different addresses. The name
  # carries both ends, because a person picking it is choosing both.
  hkg-sfo-01-ss:
    hops: [fwd-hkg01:ss, ss-sfo01:users]

  hkg-sfo-01-hy2:
    hops: [fwd-hkg01:hy2, hy2-sfo01:users]

  # A service reached from a browser shares the name table with the proxy
  # lines: a person picks from one list and does not care which kind it is.
  # Two hops, because a reverse proxy is in front — adding a service behind
  # that proxy is adding a route like this one, and the proxy's configuration
  # follows without anyone copying a port number.
  paste:
    hops: [caddy-sfo01:https, microbin-sfo01:web]
