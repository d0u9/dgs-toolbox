id: home-server

networks:
  home: 192.168.1.10

instances:
  - id: http-home
    service: httpproxy
    role: server
    bind: "0.0.0.0"
    ports:
      proxy: 8118

  - id: ss-home
    service: shadowsocks-rust
    role: ss-rust
    bind: 127.0.0.1
    ports:
      local: 1080

  - id: bin-home
    service: microbin
    role: server
    bind: "0.0.0.0"
    ports:
      web: 8080
