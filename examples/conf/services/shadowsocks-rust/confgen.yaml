secret:
  kind: base64
  bytes: 32

roles:
  server:
    auth: per-principal
    reached_by: ss-rust
    template: templates/server.json.tmpl
    defaults: element
    output: config.json
  ss-rust:
    auth: none
    template: templates/ss-rust.json.tmpl
    defaults: element
    output: config.json
