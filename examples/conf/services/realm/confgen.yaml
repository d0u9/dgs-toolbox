# A relay: it moves the bytes of one port to the hop that follows it, reads
# none of them, and terminates nothing.
#
# `forwards` is what says so, and it decides where a client's credential comes
# from: whoever dials this machine authenticates against the hop behind it, so
# the route is written out as the service that ends it. This one holds no
# account table and no secret of its own. Written together with
# `auth: per-principal`, or with `self`, the manifest does not load.
auth: none
forwards: true

template: templates/config.toml.tmpl
defaults: document
output: config.toml
