<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Doc Import · dgs</title>
<meta name="robots" content="noindex, nofollow, noarchive">
<link rel="icon" type="image/svg+xml" href="/ui/icons/box.svg">
<link rel="stylesheet" href="/ui/fonts.css">
<link rel="stylesheet" href="/ui/tokens.css">
<link rel="stylesheet" href="/ui/base.css">
<link rel="stylesheet" href="/ui/controls.css">
<link rel="stylesheet" href="/ui/filedialog.css">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div id="banner" class="banner" hidden>
  <strong>Not a doc tree.</strong> Run <code>dgs doc init</code> on this folder before importing into it.
</div>
<header class="topbar">
  <span class="brand">DOC</span>
  <a class="topbar-link" href="/browse/">Browse</a>
  <a class="topbar-link current" href="/import/">Import</a>
  <span class="topbar-spacer"></span>
  <span id="root" class="muted"></span>
</header>
<p id="error" class="message error" hidden></p>
<main class="work">
  <section class="list">
    <div class="open-bar">
      <button id="open" class="action" type="button">Open folder…</button>
      <span id="counts" class="muted numeric"></span>
    </div>
    <p id="dir" class="dir-path muted"></p>
    <div class="scroll" id="tree"></div>
    <p id="list-message" class="message"></p>
  </section>
  <section class="preview">
    <p id="empty" class="muted">Open a folder, then pick a PDF.</p>
    <iframe id="frame" title="Preview" hidden></iframe>
  </section>
  <aside id="side" class="side" hidden>
    <form id="import" hidden>
      <h2 class="panel-head">Import</h2>
      <label class="form-field"><span>Template</span><select id="template"></select></label>
      <label class="form-field" id="into-field"><span>Into</span><select id="into"></select></label>
      <div id="fields"></div>
      <p id="import-message" class="message"></p>
      <button id="import-button" class="action" type="submit">Import</button>
      <p class="message">The PDF is copied into the tree and read back before it counts. This file stays where it is.</p>
    </form>
    <div id="kept" hidden>
      <h2 class="panel-head">Already in the tree</h2>
      <p class="message">Kept as <a id="kept-link" href="/browse/"></a>.</p>
    </div>
    <section id="text" class="text" hidden>
      <h2 class="panel-head">Text</h2>
      <p id="text-message" class="message"></p>
      <pre id="text-body" class="text-body"></pre>
    </section>
  </aside>
</main>
<script type="module" src="/import.js"></script>
</body>
</html>
