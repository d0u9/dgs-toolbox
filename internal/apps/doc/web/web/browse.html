<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Doc Browse · dgs</title>
<meta name="robots" content="noindex, nofollow, noarchive">
<link rel="icon" type="image/svg+xml" href="/ui/icons/box.svg">
<link rel="stylesheet" href="/ui/fonts.css">
<link rel="stylesheet" href="/ui/tokens.css">
<link rel="stylesheet" href="/ui/base.css">
<link rel="stylesheet" href="/ui/controls.css">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div id="banner" class="banner" hidden>
  <strong>Not a doc tree.</strong> Run <code>dgs doc init</code> on this folder before importing into it.
</div>
<header class="topbar">
  <span class="brand">DOC</span>
  <a class="topbar-link current" href="/browse/">Browse</a>
  <a class="topbar-link" href="/import/">Import</a>
  <a class="topbar-link" href="/views/">Views</a>
  <a class="topbar-link" href="/merge/">Merge</a>
  <span class="topbar-spacer"></span>
  <span id="root" class="muted"></span>
</header>
<p id="error" class="message error" hidden></p>
<main class="work">
  <section class="list">
    <input id="filter" type="search" placeholder="Filter by fields or text" spellcheck="false" autocomplete="off">
    <div class="scroll">
      <h2 class="panel-head">Items <span id="count" class="count numeric"></span></h2>
      <ul id="items" class="rows"></ul>
      <p id="unread" class="message" hidden><span id="unread-count"></span>
        <button id="read-all" class="small-inline" type="button">Read their text</button></p>
      <p id="none" class="message" hidden>Nothing is kept yet. Take PDFs in on <a href="/import/">Import</a>.</p>
    </div>
  </section>
  <section class="preview">
    <p id="empty" class="muted">Pick an Item to see it.</p>
    <nav id="rail" class="rail" aria-label="Pages" hidden></nav>
    <div id="viewer" class="viewer" hidden>
      <div class="viewer-bar">
        <button type="button" id="zoom-out" class="tool" title="Zoom out (−)">−</button>
        <button type="button" id="zoom-level" class="tool zoom-level" title="Actual width (0)">100%</button>
        <button type="button" id="zoom-in" class="tool" title="Zoom in (+)">+</button>
        <button type="button" id="fit-width" class="tool" title="Fit width">Width</button>
        <button type="button" id="fit-page" class="tool" title="Fit page">Page</button>
        <span class="viewer-spacer"></span>
        <span id="page-at" class="muted numeric"></span>
      </div>
      <div id="pages" class="pages"></div>
    </div>
    <iframe id="frame" title="Preview" hidden></iframe>
  </section>
  <aside id="side" class="side" hidden>
    <h2 class="panel-head" id="detail-head"></h2>
    <form id="edit">
      <div id="edit-fields"></div>
      <p id="edit-message" class="message"></p>
      <button id="save-button" class="action" type="submit">Save fields</button>
    </form>
    <h2 class="panel-head">Notes</h2>
    <form id="notes-form">
      <textarea id="notes" class="notes" rows="4" placeholder="Only for you: never a key, never exported."></textarea>
      <p id="notes-message" class="message"></p>
      <button class="action" type="submit">Save notes</button>
    </form>
    <h2 class="panel-head">More like this</h2>
    <button id="more" class="small-inline" type="button">Find similar Items</button>
    <ul id="similar" class="rows"></ul>
    <p id="similar-message" class="message"></p>
    <h2 class="panel-head">Revisions</h2>
    <ul id="revisions" class="rows"></ul>
    <p id="head-message" class="message"></p>
    <p id="text-message" class="message text-status"></p>
  </aside>
</main>
<script type="module" src="/browse.js"></script>
</body>
</html>
